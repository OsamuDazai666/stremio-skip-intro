name: Android patches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-patches.yml'
    tags:
      - 'android-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build patches
        env:
          # Morphe's Gradle plugin and patcher are published on GitHub Packages.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon --stacktrace
          ls -la patches/build/libs

      - name: Upload patches file
        uses: actions/upload-artifact@v4
        with:
          name: skip-intro-patches
          path: android/patches/build/libs/*.mpp
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          MPP=$(ls patches/build/libs/*.mpp | head -n1)
          NAME="skip-intro-patches-${TAG#android-v}.mpp"
          cp "$MPP" "$NAME"
          gh release create "$TAG" "$NAME" --title "Android patches ${TAG#android-v}" \
            --notes "Morphe patch bundle for the Stremio Android app. Add https://github.com/${{ github.repository }} as a patch source in Morphe Manager."

          # Point Morphe Manager at the new release (it reads patches-bundle.json from the main branch).
          git fetch origin main
          git checkout main
          cat > ../patches-bundle.json <<EOF
          {
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "description": "Skip Intro for Stremio: Skip Intro and Next Episode with AniSkip and TheIntroDB timestamps",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/${NAME}",
            "signature_download_url": "",
            "version": "${TAG#android-v}"
          }
          EOF
          sed -i 's/^          //' ../patches-bundle.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../patches-bundle.json
          git commit -m "Android patches ${TAG#android-v}"
          git push origin main
